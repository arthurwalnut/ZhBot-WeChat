[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-wechat-lab"
version = "0.2.5"
description = "Native WeChat group games with transactional inbox and outbox"
requires-python = ">=3.12"
dependencies = ["Pillow>=11", "tzdata>=2025.2"]

[project.optional-dependencies]
reader = ["pywinauto>=0.6.9; sys_platform == 'win32'"]
bot = ["pefile==2023.2.7; sys_platform == 'win32'", "cryptography==49.0.0; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zxj = ["characters.json"]
wordle = ["words.json"]
wechat_reader = ["windows_ocr.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
