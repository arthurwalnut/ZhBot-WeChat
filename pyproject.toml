[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-wechat-lab"
version = "0.1.0"
description = "Independent local zxj, Wordle and read-only WeChat diagnostics"
requires-python = ">=3.12"
dependencies = ["Pillow>=11", "tzdata>=2025.2"]

[project.optional-dependencies]
reader = ["pywinauto>=0.6.9; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zxj = ["characters.json"]
wordle = ["words.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
